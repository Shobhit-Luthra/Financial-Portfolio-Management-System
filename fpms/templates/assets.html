{% extends "base.html" %}

{% block title %}- Portfolio{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">My Portfolio</h1>
    <div style="display: flex; gap: 1rem;">
        <button class="btn btn-primary" onclick="openTradeModal('buy')">
            <i class="ph ph-arrow-circle-up"></i> Buy
        </button>
        <button class="btn btn-outline" style="color: var(--loss-color); border-color: rgba(244,63,94,0.4);" onclick="openTradeModal('sell')">
            <i class="ph ph-arrow-circle-down"></i> Sell
        </button>
    </div>
</div>

<!-- Summary -->
<div class="kpi-grid" style="grid-template-columns: repeat(4, 1fr);">
    <div class="card">
        <h3 class="kpi-title">Holdings</h3>
        <div class="kpi-value" id="kpi-holdings">0</div>
    </div>
    <div class="card">
        <h3 class="kpi-title">Total Invested</h3>
        <div class="kpi-value" id="kpi-inv">--</div>
    </div>
    <div class="card">
        <h3 class="kpi-title">Current Value</h3>
        <div class="kpi-value" id="kpi-val">--</div>
    </div>
    <div class="card">
        <h3 class="kpi-title">Total P&L</h3>
        <div class="kpi-value" id="kpi-pnl">--</div>
    </div>
</div>

<div class="card">
    <div style="overflow-x: auto;">
        <table id="assets-table">
            <thead>
                <tr>
                    <th>Symbol</th><th>Name</th><th>Type</th><th>Qty</th>
                    <th>Avg Buy</th><th>CMP</th><th>P&L</th><th>Return</th><th>Quick Trade</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<!-- Unified Trade Modal -->
<div class="modal-overlay" id="tradeModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="trade-title">Buy Asset</h3>
            <button class="modal-close" onclick="closeTradeModal()"><i class="ph ph-x"></i></button>
        </div>
        <form id="trade-form" onsubmit="executeTrade(event)">
            <input type="hidden" id="trade-action" value="buy">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label">Symbol</label>
                    <input type="text" id="trade-symbol" class="form-control" style="text-transform: uppercase;" required placeholder="e.g. AAPL">
                </div>
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" id="trade-name" class="form-control" required placeholder="e.g. Apple Inc.">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label">Asset Type</label>
                    <select id="trade-type" class="form-control">
                        <option value="stock">Stock</option>
                        <option value="bond">Bond</option>
                        <option value="mutual_fund">Mutual Fund</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Date</label>
                    <input type="date" id="trade-date" class="form-control" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label">Quantity</label>
                    <input type="number" id="trade-qty" class="form-control" step="any" required oninput="calcTradeTotal()">
                </div>
                <div class="form-group">
                    <label class="form-label">Price Per Unit</label>
                    <input type="number" id="trade-price" class="form-control" step="any" required oninput="calcTradeTotal()">
                </div>
                <div class="form-group">
                    <label class="form-label">Total</label>
                    <input type="number" id="trade-total" class="form-control" readonly style="background: var(--bg-color);">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Notes (Optional)</label>
                <input type="text" id="trade-notes" class="form-control" placeholder="Reason for trade...">
            </div>
            
            <div id="trade-msg" style="display:none; padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem;"></div>

            <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                <button type="button" class="btn btn-outline" style="flex: 1;" onclick="closeTradeModal()">Cancel</button>
                <button type="submit" id="trade-submit-btn" class="btn btn-primary" style="flex: 1;">Confirm Buy</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const fmt = getCurrencyFormatter();
    let assetsData = [];

    async function loadAssets() {
        try {
            const res = await fetch('/assets');
            if (res.status === 401) return window.location.href = '/';
            const data = await res.json();
            assetsData = data.assets || [];
            renderTable();
            updateSummaryKPIs();
        } catch (e) { console.error(e); }
    }

    function updateSummaryKPIs() {
        let totalInv = 0, totalVal = 0;
        assetsData.forEach(a => {
            totalInv += a.quantity * a.avg_buy_price;
            totalVal += a.quantity * a.current_price;
        });
        const pnl = totalVal - totalInv;
        document.getElementById('kpi-holdings').textContent = assetsData.length;
        document.getElementById('kpi-inv').textContent = fmt.format(totalInv);
        document.getElementById('kpi-val').textContent = fmt.format(totalVal);
        const pnlEl = document.getElementById('kpi-pnl');
        pnlEl.textContent = `${pnl >= 0 ? '+' : ''}${fmt.format(pnl)}`;
        pnlEl.className = `kpi-value text-${pnl >= 0 ? 'gain' : 'loss'}`;
    }

    function renderTable() {
        const tbody = document.querySelector('#assets-table tbody');
        tbody.innerHTML = '';
        if (assetsData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; color: var(--text-muted);">No holdings yet. Click <strong>Buy</strong> to start trading.</td></tr>';
            return;
        }
        assetsData.forEach(a => {
            const inv = a.quantity * a.avg_buy_price;
            const val = a.quantity * a.current_price;
            const pnl = val - inv;
            const ret = inv > 0 ? (pnl / inv * 100) : 0;
            const cls = pnl >= 0 ? 'text-gain' : 'text-loss';
            const badge = a.type === 'stock' ? 'badge-stock' : (a.type === 'bond' ? 'badge-bond' : 'badge-other');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td style="font-weight:bold;">${a.symbol}</td>
                <td>${a.name}</td>
                <td><span class="badge ${badge}">${a.type.replace('_',' ')}</span></td>
                <td>${a.quantity}</td>
                <td>${fmt.format(a.avg_buy_price)}</td>
                <td>${fmt.format(a.current_price)}</td>
                <td class="${cls}">${pnl >= 0 ? '+' : ''}${fmt.format(pnl)}</td>
                <td class="${cls}">${ret >= 0 ? '+' : ''}${ret.toFixed(2)}%</td>
                <td style="white-space: nowrap;">
                    <button class="btn btn-outline" style="padding:0.25rem 0.5rem; color: var(--gain-color); border-color: rgba(34,197,94,0.3); font-size: 0.8rem;" onclick="quickTrade('buy','${a.symbol}','${a.name}','${a.type}')">
                        <i class="ph ph-plus"></i> Buy
                    </button>
                    <button class="btn btn-outline" style="padding:0.25rem 0.5rem; color: var(--loss-color); border-color: rgba(244,63,94,0.3); font-size: 0.8rem; margin-left:0.25rem;" onclick="quickTrade('sell','${a.symbol}','${a.name}','${a.type}')">
                        <i class="ph ph-minus"></i> Sell
                    </button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    // Trade Modal
    const tradeModal = document.getElementById('tradeModal');

    function openTradeModal(action) {
        document.getElementById('trade-form').reset();
        document.getElementById('trade-action').value = action;
        document.getElementById('trade-date').valueAsDate = new Date();
        document.getElementById('trade-msg').style.display = 'none';
        document.getElementById('trade-symbol').readOnly = false;
        document.getElementById('trade-name').readOnly = false;
        
        if (action === 'buy') {
            document.getElementById('trade-title').textContent = 'Buy Asset';
            document.getElementById('trade-submit-btn').textContent = 'Confirm Buy';
            document.getElementById('trade-submit-btn').style.background = 'var(--gain-color)';
        } else {
            document.getElementById('trade-title').textContent = 'Sell Asset';
            document.getElementById('trade-submit-btn').textContent = 'Confirm Sell';
            document.getElementById('trade-submit-btn').style.background = 'var(--loss-color)';
        }
        tradeModal.style.display = 'flex';
    }

    function quickTrade(action, symbol, name, type) {
        openTradeModal(action);
        document.getElementById('trade-symbol').value = symbol;
        document.getElementById('trade-name').value = name;
        document.getElementById('trade-type').value = type;
        if (action === 'sell') {
            document.getElementById('trade-symbol').readOnly = true;
            document.getElementById('trade-name').readOnly = true;
        }
    }

    function closeTradeModal() { tradeModal.style.display = 'none'; }

    function calcTradeTotal() {
        const q = parseFloat(document.getElementById('trade-qty').value) || 0;
        const p = parseFloat(document.getElementById('trade-price').value) || 0;
        document.getElementById('trade-total').value = (q * p).toFixed(2);
    }

    async function executeTrade(e) {
        e.preventDefault();
        const msgEl = document.getElementById('trade-msg');
        msgEl.style.display = 'none';

        const payload = {
            action: document.getElementById('trade-action').value,
            symbol: document.getElementById('trade-symbol').value,
            name: document.getElementById('trade-name').value,
            type: document.getElementById('trade-type').value,
            quantity: parseFloat(document.getElementById('trade-qty').value),
            price: parseFloat(document.getElementById('trade-price').value),
            date: document.getElementById('trade-date').value,
            notes: document.getElementById('trade-notes').value
        };

        try {
            const res = await fetch('/trade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();

            if (res.ok) {
                msgEl.textContent = result.message;
                msgEl.style.display = 'block';
                msgEl.style.background = 'rgba(34,197,94,0.15)';
                msgEl.style.color = 'var(--gain-color)';
                setTimeout(() => { closeTradeModal(); loadAssets(); }, 1200);
            } else {
                msgEl.textContent = result.message;
                msgEl.style.display = 'block';
                msgEl.style.background = 'rgba(244,63,94,0.15)';
                msgEl.style.color = 'var(--loss-color)';
            }
        } catch (err) {
            msgEl.textContent = 'Network error. Try again.';
            msgEl.style.display = 'block';
            msgEl.style.background = 'rgba(244,63,94,0.15)';
            msgEl.style.color = 'var(--loss-color)';
        }
    }

    window.addEventListener('DOMContentLoaded', loadAssets);
</script>
{% endblock %}
